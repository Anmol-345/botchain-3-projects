[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    # OZ 4.9.3 via npm : version exigée par @ensdomains/ens-contracts, et
    # suffisante pour notre ECDSA. Une seule OZ dans le projet = zéro conflit.
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@ensdomains/=node_modules/@ensdomains/",
]
fs_permissions = [{ access = "read", path = "./node_modules" }]

[rpc_endpoints]
# BOT Chain — mainnet (chain id 677) and Bohr testnet (chain id 968).
# See https://dev-docs.botchain.ai/docs/Developers/quick-guide/
botchain = "${BOTCHAIN_RPC_URL}"
bohr     = "${BOHR_RPC_URL}"
# Kept as an alias in case a local anvil RPC is exported.
anvil    = "${ANVIL_RPC_URL}"
